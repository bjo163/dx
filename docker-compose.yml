services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dx
      POSTGRES_USER: dx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dx_local_only}
    volumes:
      - dx_postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./infra/postgres/migrations/002_identity.sql:/docker-entrypoint-initdb.d/002-identity.sql:ro
      - ./infra/postgres/migrations/003_project_tenant_scope.sql:/docker-entrypoint-initdb.d/003-project-tenant-scope.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dx -d dx"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dx_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://dx:${POSTGRES_PASSWORD:-dx_local_only}@postgres:5432/dx
      REDIS_URL: redis://redis:6379
      DX_BOOTSTRAP_TOKEN: ${DX_BOOTSTRAP_TOKEN:-}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
volumes:
  dx_postgres:
  dx_redis:
